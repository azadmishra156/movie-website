<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Browser</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <video id="background-video" autoplay muted playsinline>
        <source id="video-source" src="videos/background1.mp4" type="video/mp4">
    </video>

    <div class="container">
        <h1>Movie Browser</h1>
        <div id="main-view" class="main-view active">
            <form id="search-form" class="search-form">
                <label for="search-input" class="visually-hidden">Search for a movie</label>
                <input type="text" id="search-input" class="search-input" placeholder="Search for a movie...">
                <button type="submit" class="search-button" aria-label="Search">
                    <i class="fas fa-search"></i>
                </button>
            </form>
            <div id="genre-filters" class="genre-filters"></div>
            <div id="movie-grid" class="movie-grid"></div>
            <div id="loader" class="loader">
                <i class="fas fa-spinner fa-spin"></i>
            </div>
            <div id="message" class="message">
                <p>Search for a movie!</p>
            </div>
            <div id="pagination" class="pagination">
                <button id="prev-page" class="pagination-button" disabled>Previous Page</button>
                <button id="next-page" class="pagination-button">Next Page</button>
            </div>
        </div>
        <div id="details-view" class="details-view"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
